[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mbkit"
version = "0.2.0"
description = "Marcelo Bayon's personal engineering kit: logging, config, resilience, result, and timing utilities."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Marcelo Bayon", email = "Marcelo.Bayon1987@gmail.com" }]
keywords = ["toolkit", "resilience", "logging", "configuration", "retry", "circuit-breaker"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = []  # standard library only, on purpose

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4", "mypy>=1.8", "build>=1.0"]
toml = ["tomli>=2.0; python_version < '3.11'"]  # only needed to read .toml on <3.11

[project.urls]
Homepage = "https://marcelobayon.com/engineering"
Repository = "https://github.com/marcelobayon/personal_engineering_kit"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mbkit = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/mbkit"]
